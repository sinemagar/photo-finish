<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Photo Finish: an interactive horse racing game built with Vue 3 and Pinia."
    />
    <meta name="theme-color" content="#09120e" />
    <title>Photo Finish</title>
    <script>
      // Apply the saved or device theme before the first paint (see src/composables/useTheme.ts).
      try {
        const saved = localStorage.getItem('photo-finish:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
